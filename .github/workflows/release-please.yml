on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          # Configured for the Syngenta Agri-AI Platform
          release-type: node
          package-name: syngenta-agri-ai
          # This will look for package.json in the root or specified paths
