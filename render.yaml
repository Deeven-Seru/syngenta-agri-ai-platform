services:
  - type: web
    name: test-backend
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: syngenta_agri
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: METEOBLUE_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: APP_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
